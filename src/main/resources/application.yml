spring:
  profiles:
    active: local
  cloud:
    openfeign:
      okhttp:
        enabled: true
      client:
        config:
          open-meteo:
            url: https://api.open-meteo.com
            connect-timeout: 5000
            read-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate  # 엔티티 & 테이블 정상 매핑 확인
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
  ai:
    google:
      genai:
        enabled: true
        project-id: dummy
        location: us-central1
        api-key: dummy
        chat:
          options:
            model: gemini-2.5-flash-lite

